<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">REDLINE static portfolio architecture</title><desc>HTML entry points load bilingual content, shared rendering, interaction and motion modules, and local lazy-loaded media. Case studies link to external sources. No server-side AI, email or workspace actions run in this website.</desc><rect width="1200" height="400" rx="8" fill="#111112"/><text x="40" y="48" font-family="monospace" font-size="16" fill="#ff526f">UNDER THE HOOD / STATIC BY DESIGN</text><g fill="#1b1b1e" stroke="#555256"><rect x="40" y="84" width="244" height="154"/><rect x="328" y="84" width="244" height="154"/><rect x="616" y="84" width="244" height="154"/><rect x="904" y="84" width="256" height="154"/></g><g font-family="Arial,Helvetica,sans-serif" fill="#f3f1ed" font-size="22" font-weight="700"><text x="62" y="142">HTML entry points</text><text x="350" y="142">Bilingual content</text><text x="638" y="142">Shared modules</text><text x="926" y="142">Usable interface</text></g><g font-family="monospace" fill="#ff526f" font-size="14"><text x="62" y="110">01</text><text x="350" y="110">02</text><text x="638" y="110">03</text><text x="926" y="110">04</text></g><g font-family="Arial,Helvetica,sans-serif" fill="#b0aeb1" font-size="17"><text x="62" y="180">Home + 5 case studies</text><text x="62" y="209">Semantic fallback content</text><text x="350" y="180">site.js + projects.js</text><text x="350" y="209">EN / FA source-backed copy</text><text x="638" y="180">Render · interact · animate</text><text x="638" y="209">Local media · preferences</text><text x="926" y="180">Search · filters · dialogs</text><text x="926" y="209">RTL · themes · motion control</text></g><g stroke="#dc143c" stroke-width="2" fill="none"><path d="M286 161H322l-8-7m8 7-8 7M574 161H610l-8-7m8 7-8 7M862 161H898l-8-7m8 7-8 7"/></g><path d="M40 280H1160" stroke="#555256"/><text x="40" y="321" font-family="Arial,Helvetica,sans-serif" fill="#f3f1ed" font-size="19">No runtime framework. No backend. No live model calls. Contact opens an email draft.</text><text x="40" y="357" font-family="Arial,Helvetica,sans-serif" fill="#b0aeb1" font-size="16">Architecture diagrams describe featured repositories — they do not execute those services.</text></svg>
